# Larger tables for dense deployments. With the default 10 m spacing a node hears
# six to ten others, and the neighbour table has to hold all of them plus the ones
# it only knows from gossip - otherwise it thrashes, evicting a neighbour it is
# about to need.
CONFIG_LOCKGRID_MAX_NEIGHBORS=16

# Link slots are what actually limit how many nodes can attach. At 100 nodes with
# six or so neighbours each, routers reach the default four links long before
# everyone has a parent, and the nodes left over have a router in range that has no
# capacity for them. Eight is affordable: a subrated link on a 200 ms interval costs
# roughly 300 us of receive per 1.6 s, so the extra slots barely move the duty cycle.
CONFIG_LOCKGRID_MAX_LINKS=8
CONFIG_LOCKGRID_MAX_ROUTES=32
CONFIG_LOCKGRID_TX_QUEUE_SIZE=12

# Denser grids mean more contention on the three rendezvous channels, so Trickle
# suppression matters more: a node that already hears plenty of beacons should not
# add to them.
CONFIG_LOCKGRID_BEACON_SUPPRESS_THRESHOLD=2
