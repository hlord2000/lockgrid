#
# Build for the topology visualisation rather than for a pass/fail verdict.
#
# The trace is what tools/trace_to_json.py parses. Logging is turned down to
# warnings because at a hundred nodes the informational log is several times the
# size of the trace itself and adds nothing the trace does not already carry.

CONFIG_LOCKGRID_TRACE=y
CONFIG_LOCKGRID_TRACE_FRAMES=y

CONFIG_LOCKGRID_LOG_LEVEL_WRN=y
CONFIG_LOG_MODE_IMMEDIATE=y

# Deterministic addresses come from the runner, and a scenario that big wants
# every neighbour slot it can get: a node in the middle of a cluster can hear
# fifteen others, and discarding them would hide the density the layout creates.
CONFIG_LOCKGRID_MAX_NEIGHBORS=16
CONFIG_LOCKGRID_MAX_ROUTES=32
