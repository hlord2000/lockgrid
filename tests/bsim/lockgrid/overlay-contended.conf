# Model a radio LockGrid does not own.
#
# MPSL cannot run under BabbleSim, so the MPSL backend itself cannot be exercised
# here. What can be exercised is the property that actually matters: that nothing
# above lg_ts.h assumes a request will be granted. A tenth of all radio requests
# are refused at the moment they were due, which is the worst case - the event
# loses its whole opportunity, exactly as a cancelled timeslot would cost it.
CONFIG_LOCKGRID_TS_REFUSE_PERMILLE=100
