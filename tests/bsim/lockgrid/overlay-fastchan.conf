# Channel statistics accumulate slowly in normal operation, and deliberately so:
# a subrated link on a 200 ms interval touches any given channel a handful of
# times a minute, so retiring one takes several minutes of evidence. That is the
# right behaviour in the field and useless in a test.
#
# This overlay speeds the evidence up without changing the logic under test: a
# short interval, no subrating, and frequent energy-detect sweeps.
CONFIG_LOCKGRID_CONN_INTERVAL_MS=50
CONFIG_LOCKGRID_CONN_INTERVAL_MIN_MS=20
CONFIG_LOCKGRID_SUBRATE_MAX=1
CONFIG_LOCKGRID_CHAN_EVAL_PERIOD_MS=1000
CONFIG_LOCKGRID_CHAN_NOISE_FLOOR_DBM=-80
